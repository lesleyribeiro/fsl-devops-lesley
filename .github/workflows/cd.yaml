name: CD Pipeline

# Deploys the application to AWS whenever code is pushed (i.e. a PR is merged)
# into either 'devel' or 'stage'. The target environment is derived directly
# from the branch name, keeping devel and stage fully isolated:
#   - push to devel -> deploys devel environment
#   - push to stage -> deploys stage environment
on:
  push:
    branches:
      - devel
      - stage

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    env:
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_FILE: environments/${{ github.ref_name }}.tfvars
      TF_STATE_KEY: ${{ github.ref_name }}/terraform.tfstate

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -var-file="${{ env.TF_VAR_FILE }}" -auto-approve

      - name: Export Terraform outputs
        working-directory: terraform
        run: |
          echo "SITE_BUCKET=$(terraform output -raw site_bucket_name)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_URL=https://$(terraform output -raw cloudfront_domain_name)" >> "$GITHUB_ENV"

      - name: Sync build to S3
        run: aws s3 sync build/ "s3://${{ env.SITE_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Print deployment URL
        run: echo "Deployed ${{ github.ref_name }} to ${{ env.CLOUDFRONT_URL }}"
