name: CI Pipeline

on:
  pull_request:
    branches:
      - devel
      - stage

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enforce branch source rule for stage
        if: github.base_ref == 'stage' && github.head_ref != 'devel'
        run: |
          echo "PRs into 'stage' are only allowed from 'devel'. Source branch was '${{ github.head_ref }}'."
          exit 1

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        env:
          CI: true
        run: npm run test

      - name: Build project
        run: npm run build